<title>지면 프리뷰 메이커</title>
<style>
  :root{
    --bg:#faf8f4;
    --surface:#ffffff;
    --surface-2:#f2ede4;
    --border:#e5ddce;
    --text:#211c15;
    --text-muted:#756a58;
    --accent:#ff5a1f;
    --accent-ink:#ffffff;
    --accent-wash:#fff0e8;
    --shadow: 0 1px 2px rgba(33,28,21,0.06), 0 8px 24px rgba(33,28,21,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15130f;
      --surface:#1e1a14;
      --surface-2:#262019;
      --border:#3a3226;
      --text:#f3ece0;
      --text-muted:#a89a84;
      --accent:#ff7a45;
      --accent-ink:#1a1108;
      --accent-wash:#3a2417;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130f;
    --surface:#1e1a14;
    --surface-2:#262019;
    --border:#3a3226;
    --text:#f3ece0;
    --text-muted:#a89a84;
    --accent:#ff7a45;
    --accent-ink:#1a1108;
    --accent-wash:#3a2417;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans KR","IBM Plex Sans",-apple-system,sans-serif;
    padding-inline:20px;
    padding-block:20px 48px;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; }

  .app{
    max-width:1180px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  header.top h1{
    font-size:1.25rem;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:2px 0 0;
    color:var(--text-muted);
    font-size:0.86rem;
  }
  .badge{
    font-family:"IBM Plex Mono",monospace;
    font-size:0.68rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-wash);
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }

  .controls{
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-size:0.74rem;
    font-weight:600;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }
  .field input[type="text"]{
    font:inherit;
    font-size:0.88rem;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
  }
  .field input[type="text"]:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .seg{
    display:flex;
    flex-wrap:wrap;
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
  }
  .seg button{
    flex:1 1 30%;
    min-width:64px;
    padding:9px 8px;
    font:inherit;
    font-size:0.84rem;
    font-weight:600;
    background:var(--surface);
    color:var(--text-muted);
    border:none;
    border-top:1px solid var(--border);
    cursor:pointer;
  }
  .seg button:first-child, .seg button:nth-child(2), .seg button:nth-child(3){ border-top:none; }
  .seg button + button{ border-left:1px solid var(--border); }
  .seg button[aria-pressed="true"]{
    background:var(--accent);
    color:var(--accent-ink);
  }

  .upload{
    border:1.5px dashed var(--border);
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface-2);
    cursor:pointer;
  }
  .upload:hover{ border-color:var(--accent); }
  .upload.drag-active{
    border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, var(--surface-2));
  }
  .upload input[type="file"]{ display:none; }
  .thumb{
    width:36px; height:36px;
    border-radius:6px;
    background:var(--surface);
    border:1px solid var(--border);
    object-fit:cover;
    flex:none;
  }
  .thumb.empty{
    display:flex;align-items:center;justify-content:center;
    color:var(--text-muted);
    font-size:1rem;
  }
  .upload-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .upload-text .name{
    font-size:0.82rem;
    font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .upload-text .hint{
    font-size:0.72rem;
    color:var(--text-muted);
  }

  details.adjust{
    border:1px solid var(--border);
    border-radius:10px;
    padding:2px 12px;
    background:var(--surface-2);
  }
  details.adjust summary{
    cursor:pointer;
    padding:9px 0;
    font-size:0.8rem;
    font-weight:600;
    color:var(--text-muted);
    list-style:none;
  }
  details.adjust summary::-webkit-details-marker{ display:none; }
  details.adjust summary::before{ content:"▸ "; }
  details.adjust[open] summary::before{ content:"▾ "; }
  .slider-row{ display:flex; flex-direction:column; gap:4px; padding-block:8px; }
  .slider-row .slabel{
    display:flex; justify-content:space-between;
    font-size:0.76rem; color:var(--text-muted);
  }
  .slider-row .slabel .val{ color:var(--text); font-family:"IBM Plex Mono",monospace; }
  input[type="range"]{ width:100%; accent-color:var(--accent); }

  .btn{
    font:inherit;
    font-size:0.86rem;
    font-weight:700;
    padding:10px 14px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:transparent;
  }
  .btn.primary:hover{ filter:brightness(1.05); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .preview-pane{
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:center;
  }
  .canvas-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    position:relative;
    /* 캔버스 자체가 실제 PDF 페이지처럼 진한 배경(#191919)으로 꽉 차 있어서,
       주변을 밝은 체크무늬로 감싸면 경계가 뚝 끊겨 보였다.
       캔버스와 같은 톤의 진한 매트로 감싸서 하나의 무대처럼 보이게 한다. */
    background:#141310;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:20px;
  }
  #stage{
    width:100%;
    max-width:640px;
    height:auto;
    border-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.45);
  }
  /* 소재/하우스 프레임 이미지가 아직 로드되기 전에 사용자가 지면 탭을 누르거나
     텍스트를 입력하면 캔버스가 라벨만 있고 나머지가 새까맣게 렌더링될 수 있었다.
     로딩이 끝나기 전까지는 이 오버레이로 캔버스를 가리고, 아래 컨트롤도 잠가서
     "검은 화면" 자체가 나타날 수 없게 한다. */
  .loading-overlay{
    position:absolute;
    inset:20px;
    max-width:640px;
    margin:0 auto;
    background:#191919;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,0.7);
    font-size:0.85rem;
    font-weight:600;
    letter-spacing:0.01em;
    z-index:5;
  }
  .loading-overlay[hidden]{ display:none; }

  .queue{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .queue-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.78rem; color:var(--text-muted); font-weight:600;
  }
  .queue-list{
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .queue-item{
    position:relative;
    width:64px;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    background:var(--surface-2);
  }
  .queue-item img{ width:100%; display:block; }
  .queue-item .x{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    color:#fff;
    border:none;
    font-size:10px;
    line-height:16px;
    text-align:center;
    cursor:pointer;
    padding:0;
  }
  .queue-item .tag{
    position:absolute; bottom:0; left:0; right:0;
    font-size:0.55rem;
    text-align:center;
    background:rgba(0,0,0,0.55);
    color:#fff;
    padding:1px 0;
  }

  .export-row{
    width:100%;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .status{
    font-size:0.76rem;
    color:var(--text-muted);
    min-height:1.1em;
  }
  .status.err{ color:#c94a3c; }
  .status.ok{ color:#2f8f5b; }
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>지면 프리뷰 메이커</h1>
      <p>배경·소재·로고만 올리면 번개장터 게재지면 프리뷰 PDF가 나옵니다</p>
    </div>
    <span class="badge">Bunjang Ads Ops</span>
  </header>

  <div class="layout">
    <div class="panel controls">
      <div class="field">
        <label>지면 종류</label>
        <div class="seg" id="placementSeg">
          <button type="button" data-val="splash" aria-pressed="true">스플래시</button>
          <button type="button" data-val="homepopup" aria-pressed="false">홈팝업</button>
          <button type="button" data-val="appexit" aria-pressed="false">앱종료</button>
          <button type="button" data-val="brandbanner" aria-pressed="false">브랜드배너</button>
          <button type="button" data-val="keywordbanner" aria-pressed="false">키워드배너</button>
        </div>
      </div>

      <div class="field">
        <label for="mediaName">브랜드명</label>
        <input type="text" id="mediaName" placeholder="예: 카카오게임즈" value="카카오게임즈">
      </div>
      <div class="field">
        <label for="campaignName">캠페인명</label>
        <input type="text" id="campaignName" placeholder="예: 도깨비의세계" value="도깨비의세계">
      </div>

      <div class="field" id="bgField">
        <label>배경 이미지</label>
        <label class="upload" for="bgUpload">
          <img class="thumb" id="bgThumb" alt="">
          <div class="upload-text">
            <span class="name" id="bgName">샘플 그라디언트 적용됨</span>
            <span class="hint">클릭해서 캠페인 배경으로 교체</span>
          </div>
          <input type="file" id="bgUpload" accept="image/*">
        </label>
      </div>

      <div class="field" id="keywordFrameField" style="display:none;">
        <label>기준 화면 캡처 (검색결과 스크린샷)</label>
        <label class="upload" for="keywordFrameUpload">
          <img class="thumb" id="keywordFrameThumb" alt="">
          <div class="upload-text">
            <span class="name" id="keywordFrameName">샘플 화면 적용됨</span>
            <span class="hint">실제로 그 키워드를 검색한 화면을 캡처해서 올려주세요 · 비워두면 샘플 화면이 쓰여요. 배너 자리는 아래 소재로 덮어써집니다.</span>
          </div>
          <input type="file" id="keywordFrameUpload" accept="image/*">
        </label>
      </div>

      <div class="field">
        <label id="creativeFieldLabel">소재 (캐릭터 / 제품 컷)</label>
        <label class="upload" for="creativeUpload">
          <img class="thumb" id="creativeThumb" alt="">
          <div class="upload-text">
            <span class="name" id="creativeName">샘플 소재 적용됨</span>
            <span class="hint" id="creativeHint">투명 배경 PNG/WEBP 권장</span>
          </div>
          <input type="file" id="creativeUpload" accept="image/*">
        </label>
      </div>

      <div class="field" id="homepopupFitField" style="display:none;">
        <label>소재 맞춤 방식</label>
        <div class="seg" id="homepopupFitSeg">
          <button type="button" data-val="cover" aria-pressed="true">꽉 채우기 (크롭됨)</button>
          <button type="button" data-val="contain" aria-pressed="false">전체 보이기 (안 잘림)</button>
        </div>
      </div>

      <div class="field" id="logoField">
        <label>공동 브랜딩 로고 (선택)</label>
        <label class="upload" for="logoUpload">
          <img class="thumb" id="logoThumb" alt="">
          <div class="upload-text">
            <span class="name" id="logoName">샘플 로고 적용됨</span>
            <span class="hint">흰 배경 카드형이어도 자동 처리</span>
          </div>
          <input type="file" id="logoUpload" accept="image/*">
        </label>
      </div>

      <details class="adjust" id="adjustPanel">
        <summary>세부 조정</summary>
        <div class="slider-row">
          <div class="slabel"><span>소재 하단 크롭</span><span class="val mono" id="cropVal">16%</span></div>
          <input type="range" id="cropSlider" min="0" max="40" value="16">
        </div>
        <div class="slider-row">
          <div class="slabel"><span>로고 폭</span><span class="val mono" id="logoWidthVal">66%</span></div>
          <input type="range" id="logoWidthSlider" min="30" max="100" value="66">
        </div>
      </details>

      <div class="status" id="status"></div>
    </div>

    <div class="panel preview-pane">
      <div class="canvas-wrap">
        <canvas id="stage" width="1440" height="810"></canvas>
        <div class="loading-overlay" id="loadingOverlay">이미지 불러오는 중…</div>
      </div>

      <div class="queue">
        <div class="queue-head">
          <span>PDF에 담을 페이지 (<span id="queueCount">0</span>)</span>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn" id="addPageBtn">+ 이 화면 추가</button>
            <button type="button" class="btn" id="addBothBtn">전체 지면 모두 담기</button>
          </div>
        </div>
        <p class="hint" style="margin:2px 0 0; font-size:0.72rem; color:var(--text-muted);">지면을 각각 추가하면 하나의 PDF에 페이지로 합쳐서 저장돼요. 큐가 비어 있으면 지금 화면 1장만 저장됩니다.</p>
        <div class="field" style="margin-top:8px;">
          <label for="campaignPeriod">게재기간 (PDF 표지에 들어감)</label>
          <input type="text" id="campaignPeriod" placeholder="예: 2026.08.04 ~ 2026.08.07">
        </div>
        <div class="queue-list" id="queueList"></div>
      </div>

      <div class="export-row">
        <button type="button" class="btn" id="downloadPngBtn">현재 화면 PNG 저장</button>
        <button type="button" class="btn primary" id="downloadPdfBtn">PDF로 저장</button>
      </div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  // ---- 원본 게재지면 PDF에서 실측한 좌표 (pt, 캔버스 959.76 x 540.13pt 기준) ----
  const PAGE_PT_W = 959.76, PAGE_PT_H = 540.13;
  const CANVAS_W = 1440, CANVAS_H = 810;
  const S = CANVAS_W / PAGE_PT_W;

  const LABEL_BOX = [12.24, 9.36, 210.24, 69.13];
  const LINE1_POS = [19.7, 30.5];
  const LINE2_POS = [19.7, 52.5];
  const PLACEMENT_NAME_POS = [19.7, 81.5];

  const FRAME_RECT = [372.96, 48.25, 611.28, 509.17]; // 홈팝업/스플래시/앱종료/브랜드배너/키워드배너 공용 폰 프레임
  const HOMEPOPUP_CREATIVE_RECT = [372.96, 298.16, 611.28, 509.17];
  // 앱종료(뒤로가기 시 노출되는 전면광고) 카드 영역 — 실제 캡처 스크린샷(1080x2064)에서
  // 카드 좌/상/우/하 픽셀 경계를 실측한 뒤, FRAME_RECT 비율로 환산한 값
  const APPEXIT_CREATIVE_RECT = [396.55, 82.82, 587.45, 448.77];
  // 브랜드배너(마이페이지 노출)·키워드배너(검색결과 노출) — 각각 실제 캡처(415x899, 2026-07-28
  // 슬랙 스레드 첨부)에서 배너 영역의 픽셀 경계를 실측한 뒤, FRAME_RECT 비율로 환산한 값
  const BRANDBANNER_CREATIVE_RECT = [372.96, 262.35, 611.28, 323.75];
  const KEYWORDBANNER_CREATIVE_RECT = [385.02, 248.05, 598.66, 315.75];
  const LOGO_REGION_FRAC = [0.2935, 0.2654, 0.7065, 0.3059];
  const STATUS_BAR_FRAC = 0.06;
  const BG_COLOR = "#191919";

  function px(rect){ return rect.map(v => v * S); }

  function loadImage(src){
    return new Promise((resolve, reject) => {
      if (!src){ resolve(null); return; }
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  // 각자의 소재 이미지와 크롭/전체보이기 모드를 따로 가지도록 하는 헬퍼
  function placementLabel(p){

    if (p === "brandbanner") return "브랜드배너";

    return "스플래시";

  function cardCreativeKey(p){ return p + "CreativeImg"; }
  function getCardCreative(p){ return state[cardCreativeKey(p)]; }

  // ---- 캔버스 드로잉 헬퍼 ----
  function srcDims(img){
    // 일반 <img>는 naturalWidth/Height, 플래튼용 오프스크린 <canvas>는 width/height를 씀
    return { w: img.naturalWidth || img.width, h: img.naturalHeight || img.height };
  }

  // 반투명 PNG/WEBP 소재를 흰 배경 위에 미리 합성해둔다.
  // 홈팝업 소재처럼 "불투명 카드"여야 하는 이미지에 투명 배경이 섞여 들어오면
  // 밑에 깔린 스크린샷이 비쳐 보이는 등 이상하게 보이는 걸 막기 위함.
  // 이미지당 1회만 계산해서 캐시한다.
  function getFlattened(img, bg){
    if (!img) return img;
    bg = bg || "#ffffff";
    const cacheKey = "__flat_" + bg;
    if (img[cacheKey]) return img[cacheKey];
    const { w, h } = srcDims(img);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    const cctx = c.getContext("2d");
    cctx.fillStyle = bg;
    cctx.fillRect(0, 0, c.width, c.height);
    cctx.drawImage(img, 0, 0, c.width, c.height);
    img[cacheKey] = c;
    return c;
  }

  function coverCrop(boxW, boxH, srcW, srcH){
    const boxRatio = boxW / boxH, srcRatio = srcW / srcH;
    if (srcRatio > boxRatio){
      const sh = srcH, sw = srcH * boxRatio;
      return { sx:(srcW - sw) / 2, sy:0, sw, sh };
    }
    const sw = srcW, sh = srcW / boxRatio;
    return { sx:0, sy:(srcH - sh) / 2, sw, sh };
  }

  function drawCover(ctx, img, x, y, w, h){
    const { w: sw0, h: sh0 } = srcDims(img);
    const c = coverCrop(w, h, sw0, sh0);
    ctx.drawImage(img, c.sx, c.sy, c.sw, c.sh, x, y, w, h);
  }

  function containSize(boxW, boxH, srcW, srcH){
    const boxRatio = boxW / boxH, srcRatio = srcW / srcH;
    if (srcRatio > boxRatio) return { w:boxW, h:boxW / srcRatio };
    return { w:srcRatio * boxH, h:boxH };
  }

  function drawContain(ctx, img, x, y, boxW, boxH){
    const { w: sw0, h: sh0 } = srcDims(img);
    const { w, h } = containSize(boxW, boxH, sw0, sh0);
    const dx = x + (boxW - w) / 2, dy = y + (boxH - h) / 2;
    ctx.drawImage(img, dx, dy, w, h);
    return { x:dx, y:dy, w, h };
  }

  let fontsReady = false;
  function drawLabel(ctx, mediaName, campaignName, placementLabel){
    const [bx0, by0, bx1, by1] = px(LABEL_BOX);
    // 라벨 박스가 순수 검정(#000000)이라 캔버스 배경(#191919)과 미묘하게 달라서
    // 경계선이 도드라져 보였다. 배경과 같은 색으로 맞춰 하나로 어우러지게 한다.
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
    ctx.fillStyle = "#ffffff";
    ctx.textBaseline = "alphabetic";
    ctx.font = `700 ${16 * S}px "IBM Plex Sans KR"`;
    ctx.fillText(`게재지면_${mediaName || ""}`, LINE1_POS[0] * S, LINE1_POS[1] * S);
    ctx.font = `400 ${16 * S}px "IBM Plex Sans KR"`;
    ctx.fillText(`: <${campaignName || ""}>`, LINE2_POS[0] * S, LINE2_POS[1] * S);
    ctx.fillText(placementLabel, PLACEMENT_NAME_POS[0] * S, PLACEMENT_NAME_POS[1] * S);
  }

  // 홈팝업(전달받은 폰 스크린샷 위에 광고 카드 하나를 덮어씌우는 지면)과
  // 앱종료(뒤로가기 시 뜨는 전면광고 카드도 구조가 동일)가 공유하는 렌더러.
  // baseImg: 하우스 프레임으로 쓰는 실측 스크린샷, creativeRect: 그 위에 덮을 카드 영역(pt)
  function renderCardOverlay(ctx, placement, baseImg, creativeRect){
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    const [fx0, fy0, fx1, fy1] = px(FRAME_RECT);
    if (baseImg){
      drawCover(ctx, baseImg, fx0, fy0, fx1 - fx0, fy1 - fy0);
    } else {
      // 하우스 프레임 이미지를 못 불러온 예외 상황에서도, 원인을 알 수 없는
      // 새까만 화면 대신 무슨 일이 있었는지 알 수 있는 안내를 남긴다.
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.font = `400 ${13 * S}px "IBM Plex Sans KR", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("프레임 이미지를 불러오지 못했어요. 새로고침해 주세요.", CANVAS_W / 2, (fy0 + fy1) / 2);
      ctx.textAlign = "left";
    }
    const [cx0, cy0, cx1, cy1] = px(creativeRect);
    const cw = cx1 - cx0, ch = cy1 - cy0;
    const creative = getCardCreative(placement);
    if (creative){
      // 카드 소재는 카드 전체를 채우는 불투명 이미지가 원칙이라, 투명 배경이 섞여 있어도
      // 흰 배경 위에 미리 합성해서 밑 스크린샷이 비쳐 보이지 않게 한다.
      const flat = getFlattened(creative, "#ffffff");
      if (state.fitMode[placement] === "contain"){
        // "전체 보이기": 잘리지 않게 카드 안에 맞추고, 남는 영역은 흰 카드 배경으로 채운다.
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(cx0, cy0, cw, ch);
        drawContain(ctx, flat, cx0, cy0, cw, ch);
      } else {
        drawCover(ctx, flat, cx0, cy0, cw, ch);
      }
    }
    drawLabel(ctx, state.mediaName, state.campaignName, placementLabel(placement));
  }

  function renderSplash(ctx){
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    const [fx0, fy0, fx1, fy1] = px(FRAME_RECT);
    const frameW = fx1 - fx0, frameH = fy1 - fy0;

    let screen = { x:fx0, y:fy0, w:frameW, h:frameH };
    if (splashBaseImg) screen = drawContain(ctx, splashBaseImg, fx0, fy0, frameW, frameH);

    const bgY0 = screen.y + STATUS_BAR_FRAC * screen.h;
    if (state.bgImg){
      // cover 크롭으로 그려서 배경 이미지 비율이 눌리거나 늘어나지 않게 한다
      // (그라디언트처럼 무늬 없는 이미지는 원래도 티가 안 났지만, 실사진 배경은 늘어나면 바로 티가 남)
      drawCover(ctx, getFlattened(state.bgImg, BG_COLOR), screen.x, bgY0, screen.w, (screen.y + screen.h) - bgY0);
    }

    if (state.logoImg){
      const [lx0f, ly0f, lx1f, ly1f] = LOGO_REGION_FRAC;
      const cx = screen.x + (lx0f + lx1f) / 2 * screen.w;
      const cy = screen.y + (ly0f + ly1f) / 2 * screen.h;
      const logoW = state.logoWidthFrac * frameW;
      const logoH = logoW / (state.logoImg.naturalWidth / state.logoImg.naturalHeight);
      ctx.drawImage(state.logoImg, cx - logoW / 2, cy - logoH / 2, logoW, logoH);
    }

    const splashCreative = state.splashCreativeImg;
    if (splashCreative){
      const { w: srcW, h: srcH } = srcDims(splashCreative);
      const keepH = srcH * (1 - state.cropFrac);
      let ow = screen.w;
      let oh = ow / (srcW / keepH);
      // 세로로 긴 소재를 올렸을 때 프레임 위쪽(라벨 영역)까지 넘치지 않도록,
      // 남는 세로 공간(화면 전체 높이) 안에서 비율을 유지한 채 줄인다 (자르지 않음).
      const maxH = screen.h;
      if (oh > maxH){
        oh = maxH;
        ow = oh * (srcW / keepH);
      }
      const oy0 = (screen.y + screen.h) - oh;
      const ox0 = screen.x + (screen.w - ow) / 2;
      ctx.drawImage(splashCreative, 0, 0, srcW, keepH, ox0, oy0, ow, oh);
    }

    drawLabel(ctx, state.mediaName, state.campaignName, placementLabel("splash"));
  }

  function render(){
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    if (state.placement === "homepopup") renderCardOverlay(ctx, "homepopup", homepopupBaseImg, HOMEPOPUP_CREATIVE_RECT);
    else if (state.placement === "appexit") renderCardOverlay(ctx, "appexit", appexitBaseImg, APPEXIT_CREATIVE_RECT);
    else if (state.placement === "brandbanner") renderCardOverlay(ctx, "brandbanner", brandbannerBaseImg, BRANDBANNER_CREATIVE_RECT);
    else if (state.placement === "keywordbanner") renderCardOverlay(ctx, "keywordbanner", keywordbannerBaseImg, KEYWORDBANNER_CREATIVE_RECT);
    else renderSplash(ctx);
    updateStatus();
  }

  function isReadyFor(placement){
    if (placement === "splash") return !!(state.bgImg && state.splashCreativeImg);
    return !!getCardCreative(placement);
  }

  function currentReady(){
    return isReadyFor(state.placement);
  }

  function updateStatus(){
    const el = document.getElementById("status");
    const addBtn = document.getElementById("addPageBtn");
    const pdfBtn = document.getElementById("downloadPdfBtn");
    const pngBtn = document.getElementById("downloadPngBtn");
    const ready = currentReady();
    addBtn.disabled = !ready;
    pngBtn.disabled = !ready;
    pdfBtn.disabled = !ready && queue.length === 0;
    if (!ready){
      el.textContent = state.placement === "splash"
        ? "배경 이미지와 소재 이미지를 올려주세요."
        : "소재 이미지를 올려주세요.";
      el.className = "status err";
    } else {
      el.textContent = "미리보기 반영됨 — 실제 값으로 바꾸려면 이미지를 다시 올리세요.";
      el.className = "status";
    }
  }

  // ---- 페이지 큐 ----
  const queue = [];

  function refreshQueueUI(){
    document.getElementById("queueCount").textContent = queue.length;
    const list = document.getElementById("queueList");
    list.innerHTML = "";
    queue.forEach((item, idx) => {
      const div = document.createElement("div");
      div.className = "queue-item";
      const img = document.createElement("img");
      img.src = item.thumb;
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = placementLabel(item.placement);
      const x = document.createElement("button");
      x.className = "x";
      x.textContent = "×";
      x.type = "button";
      x.onclick = () => { queue.splice(idx, 1); refreshQueueUI(); updateStatus(); };
      div.appendChild(img);
      div.appendChild(tag);
      div.appendChild(x);
      list.appendChild(div);
    });
    updateStatus();
  }

  function addCurrentPage(){
    if (!currentReady()) return;
    const canvas = document.getElementById("stage");
    queue.push({
      placement: state.placement,
      dataUrl: canvas.toDataURL("image/jpeg", 0.92),
      thumb: canvas.toDataURL("image/jpeg", 0.6),
    });
    refreshQueueUI();
  }

  function addBothPages(){
    const status = document.getElementById("status");
    const order = ["splash", "homepopup", "appexit", "brandbanner", "keywordbanner"];
    const missing = order.filter(p => !isReadyFor(p));
    if (missing.length){
      status.textContent = "먼저 " + missing.map(placementLabel).join(", ") + " 소재를 올려주세요.";
      status.className = "status err";
      return;
    }
    const original = state.placement;
    const canvas = document.getElementById("stage");
    order.forEach(p => {
      state.placement = p;
      render();
      queue.push({
        placement: p,
        dataUrl: canvas.toDataURL("image/jpeg", 0.92),
        thumb: canvas.toDataURL("image/jpeg", 0.6),
      });
    });
    state.placement = original;
    render();
    refreshQueueUI();
  }

  // ---- 다운로드 (downloads 캐패빌리티 경유) ----
  async function offerSave(filename, blobOrString){
    const status = document.getElementById("status");
    try {
      const downloads = window.claude ? await window.claude.use("downloads") : null;
      if (!downloads){
        status.textContent = "이 화면에서는 파일 저장을 지원하지 않아요.";
        status.className = "status err";
        return;
      }
      const res = await downloads.save({ filename, data: blobOrString });
      status.textContent = res.status === "saved" ? `${filename} 저장했어요.` : "전달했어요.";
      status.className = "status ok";
    } catch (err) {
      if (err && err.code === "declined") return;
      status.textContent = "저장에 실패했어요: " + (err && err.message ? err.message : "알 수 없는 오류");
      status.className = "status err";
    }
  }

  function canvasToBlob(canvas, type, quality){
    return new Promise(resolve => canvas.toBlob(resolve, type, quality));
  }

  // 대행사 전달용 파일명 규칙: BGZT_<지면>_<캠페인명>_프리뷰
  // (예: BGZT_앱종료_반스_프리뷰.pdf) — <지면>과 <캠페인명>만 매번 바뀐다.
  function fileBaseName(placementPart){
    const campaign = (state.campaignName || "").trim() || "캠페인";
    return `BGZT_${placementPart}_${campaign}_프리뷰`;
  }

  // 큐에 담긴 페이지들이 전부 같은 지면이면 그 지면명을, 여러 지면이 섞여 있으면
  // "전체"를 <지면> 자리에 쓴다.
  function pdfPlacementPart(pages){
    if (!pages.length) return placementLabel(state.placement);
    const uniquePlacements = [...new Set(pages.map(p => p.placement))];
    if (uniquePlacements.length === 1) return placementLabel(uniquePlacements[0]);
    return "전체";
  }

  async function downloadCurrentPng(){
    if (!currentReady()) return;
    const canvas = document.getElementById("stage");
    const blob = await canvasToBlob(canvas, "image/png");
    await offerSave(`${fileBaseName(placementLabel(state.placement))}.png`, blob);
  }

  // PDF 맨 앞에 붙는 표지 페이지: 검은 배경 + "번개장터_프리뷰_브랜드명" + 게재기간.
  // 다른 페이지들과 동일하게 오프스크린 캔버스에 그려서 이미지로 삽입한다 —
  // jsPDF 기본 폰트는 한글을 지원하지 않아서, 캔버스로 그려야 한글이 깨지지 않는다.
  function renderCoverPageDataUrl(){
    const canvas = document.createElement("canvas");
    canvas.width = CANVAS_W;
    canvas.height = CANVAS_H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";
    ctx.font = `700 ${34 * S}px "IBM Plex Sans KR"`;
    const title = `번개장터_프리뷰_${state.mediaName || "브랜드명"}`;
    ctx.fillText(title, CANVAS_W / 2, CANVAS_H / 2 - 16 * S);

    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.font = `400 ${18 * S}px "IBM Plex Sans KR"`;
    const period = (state.campaignPeriod || "").trim();
    ctx.fillText(`게재기간 : ${period || "미입력"}`, CANVAS_W / 2, CANVAS_H / 2 + 26 * S);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    return canvas.toDataURL("image/jpeg", 0.92);
  }

  async function downloadPdf(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:"pt", format:[PAGE_PT_W, PAGE_PT_H], orientation:"landscape" });
    let pages = queue.slice();
    if (pages.length === 0 && currentReady()){
      const canvas = document.getElementById("stage");
      pages = [{ dataUrl: canvas.toDataURL("image/jpeg", 0.92), placement: state.placement }];
    }
    if (pages.length === 0) return;
    const coverDataUrl = renderCoverPageDataUrl();
    doc.addImage(coverDataUrl, "JPEG", 0, 0, PAGE_PT_W, PAGE_PT_H);
    pages.forEach((p) => {
      doc.addPage([PAGE_PT_W, PAGE_PT_H], "landscape");
      doc.addImage(p.dataUrl, "JPEG", 0, 0, PAGE_PT_W, PAGE_PT_H);
    });
    const blob = doc.output("blob");
    await offerSave(`${fileBaseName(pdfPlacementPart(pages))}.pdf`, blob);
  }

  // ---- UI 바인딩 ----
  let creativeUi = {
    splash: { thumbSrc: null, name: "샘플 소재 적용됨" },
    homepopup: { thumbSrc: null, name: "샘플 소재 적용됨" },
    appexit: { thumbSrc: null, name: "샘플 소재 적용됨" },
    brandbanner: { thumbSrc: null, name: "샘플 소재 적용됨" },
    keywordbanner: { thumbSrc: null, name: "샘플 소재 적용됨" },
  };

  function updateCreativeFieldUI(){
    const p = state.placement;
    const label = document.getElementById("creativeFieldLabel");
    const hint = document.getElementById("creativeHint");
    const thumb = document.getElementById("creativeThumb");
    const name = document.getElementById("creativeName");
    if (p === "homepopup"){
      label.textContent = "소재 (홈팝업 광고 이미지)";
      hint.textContent = "카드 전체를 채우는 이미지 권장 · 아래 '소재 맞춤 방식'에서 크롭 여부 선택 가능";
    } else if (p === "appexit"){
      label.textContent = "소재 (앱종료 전면광고 이미지)";
      hint.textContent = "카드 전체를 채우는 이미지 권장 · 아래 '소재 맞춤 방식'에서 크롭 여부 선택 가능";
    } else if (p === "brandbanner"){
      label.textContent = "소재 (브랜드배너 이미지)";
      hint.textContent = "가로로 넓은 배너 이미지 권장 · 아래 '소재 맞춤 방식'에서 크롭 여부 선택 가능";
    } else if (p === "keywordbanner"){
      label.textContent = "소재 (키워드배너 이미지)";
      hint.textContent = "가로로 넓은 배너 이미지 권장 · 아래 '소재 맞춤 방식'에서 크롭 여부 선택 가능";
    } else {
      label.textContent = "소재 (캐릭터 / 제품 컷)";
      hint.textContent = "투명 배경 PNG/WEBP 권장";
    }
    const info = creativeUi[p];
    if (info.thumbSrc) thumb.src = info.thumbSrc;
    name.textContent = info.name;
  }

  function setPlacement(val){
    state.placement = val;
    document.querySelectorAll("#placementSeg button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.val === val));
    });
    document.getElementById("bgField").style.display = val === "splash" ? "" : "none";
    document.getElementById("logoField").style.display = val === "splash" ? "" : "none";
    document.getElementById("adjustPanel").style.display = val === "splash" ? "" : "none";
    // 키워드배너는 지면 자체가 "그 키워드를 검색한 화면"이라 고정 샘플로 대체할 수 없다.
    // 캠페인마다 실제 검색 캡처를 올려서 기준 화면으로 쓸 수 있게 별도 업로드를 둔다.
    document.getElementById("keywordFrameField").style.display = val === "keywordbanner" ? "" : "none";
    const hasFitToggle = val === "homepopup" || val === "appexit" || val === "brandbanner" || val === "keywordbanner";
    document.getElementById("homepopupFitField").style.display = hasFitToggle ? "" : "none";
    if (hasFitToggle){
      const mode = state.fitMode[val];
      document.querySelectorAll("#homepopupFitSeg button").forEach(b => {
        b.setAttribute("aria-pressed", String(b.dataset.val === mode));
      });
    }
    updateCreativeFieldUI();
    render();
  }

  // 업로드 영역(label.upload)에 파일을 끌어다 놓아도 클릭해서 고른 것과 똑같이
  // 처리되도록, "change" 이벤트와 드래그&드롭 이벤트가 같은 처리 함수를 공유한다.
  function enableDrop(inputId, handleFile){
    const label = document.querySelector(`label[for="${inputId}"]`);
    if (!label) return;
    let dragDepth = 0;
    label.addEventListener("dragenter", (e) => {
      e.preventDefault();
      dragDepth++;
      label.classList.add("drag-active");
    });
    label.addEventListener("dragover", (e) => { e.preventDefault(); });
    label.addEventListener("dragleave", (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) label.classList.remove("drag-active");
    });
    label.addEventListener("drop", (e) => {
      e.preventDefault();
      dragDepth = 0;
      label.classList.remove("drag-active");
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")){
        const status = document.getElementById("status");
        status.textContent = "이미지 파일만 끌어다 놓을 수 있어요.";
        status.className = "status err";
        return;
      }
      handleFile(file);
    });
  }

  function bindFileInput(inputId, thumbId, nameId, onLoaded, sampleFlagKey){
    async function processFile(file){
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = await loadImage(url);
      onLoaded(img);
      state[sampleFlagKey] = false;
      document.getElementById(thumbId).src = url;
      document.getElementById(nameId).textContent = file.name;
      render();
    }
    document.getElementById(inputId).addEventListener("change", async (e) => {
      await processFile(e.target.files && e.target.files[0]);
    });
    enableDrop(inputId, processFile);
  }

  let debounceTimer = null;
  function debounceRender(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  }

  // 이미지 로딩이 끝나기 전에는 지면 탭/입력/업로드를 모두 잠가서,
  // 로딩 중 사용자가 뭔가를 눌러 "라벨만 있고 나머지는 새까만" 상태로
  // render()가 실행되는 일이 아예 생기지 않게 한다.
  function setControlsDisabled(disabled){
    const ids = [
      "mediaName", "campaignName", "creativeUpload", "bgUpload", "logoUpload",
      "cropSlider", "logoWidthSlider", "addPageBtn", "addBothBtn",
      "downloadPngBtn", "downloadPdfBtn",
    ];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = disabled;
    });
    document.querySelectorAll("#placementSeg button, #homepopupFitSeg button").forEach(b => {
      b.disabled = disabled;
    });
  }

  // 개별 이미지 하나가 로드에 실패해도(예: 손상된 파일, 코덱 미지원) 나머지
  // 자산까지 통째로 날아가지 않도록, Promise.all 대신 각 로드를 개별적으로
  // try/catch로 감싼다. 실패한 자산은 null로 남고, 기존 코드가 이미
  // "if (img)" 형태로 null을 안전하게 처리한다.
  async function safeLoadImage(src, label){
    try {
      return await loadImage(src);
    } catch (err) {
      console.warn("이미지 로드 실패:", label, err);
      return null;
    }
  }

  async function init(){
    setControlsDisabled(true);
    document.querySelectorAll("#placementSeg button").forEach(b => {
      b.addEventListener("click", () => setPlacement(b.dataset.val));
    });

    document.querySelectorAll("#homepopupFitSeg button").forEach(b => {
      b.addEventListener("click", () => {
        state.fitMode[state.placement] = b.dataset.val;
        document.querySelectorAll("#homepopupFitSeg button").forEach(btn => {
          btn.setAttribute("aria-pressed", String(btn === b));
        });
        render();
      });
    });

    document.getElementById("mediaName").addEventListener("input", (e) => {
      state.mediaName = e.target.value; debounceRender();
    });
    document.getElementById("campaignName").addEventListener("input", (e) => {
      state.campaignName = e.target.value; debounceRender();
    });
    document.getElementById("campaignPeriod").addEventListener("input", (e) => {
      state.campaignPeriod = e.target.value;
    });

    document.getElementById("cropSlider").addEventListener("input", (e) => {
      state.cropFrac = Number(e.target.value) / 100;
      document.getElementById("cropVal").textContent = e.target.value + "%";
      render();
    });
    document.getElementById("logoWidthSlider").addEventListener("input", (e) => {
      state.logoWidthFrac = Number(e.target.value) / 100;
      document.getElementById("logoWidthVal").textContent = e.target.value + "%";
      render();
    });

    bindFileInput("bgUpload", "bgThumb", "bgName", (img) => { state.bgImg = img; }, "usingSampleBg");
    bindFileInput("logoUpload", "logoThumb", "logoName", (img) => { state.logoImg = img; }, "usingSampleLogo");
    bindFileInput("keywordFrameUpload", "keywordFrameThumb", "keywordFrameName", (img) => { keywordbannerBaseImg = img; }, "usingSampleKeywordbannerBase");

    async function processCreativeFile(file){
      if (!file) return;
      const url = URL.createObjectURL(file);
      const img = await loadImage(url);
      const p = state.placement;
      if (p === "splash"){
        state.splashCreativeImg = img;
        state.usingSampleSplashCreative = false;
      } else {
        setCardCreative(p, img);
        state["usingSample" + p[0].toUpperCase() + p.slice(1) + "Creative"] = false;
      }
      creativeUi[p] = { thumbSrc: url, name: file.name };
      updateCreativeFieldUI();
      render();
    }
    document.getElementById("creativeUpload").addEventListener("change", async (e) => {
      await processCreativeFile(e.target.files && e.target.files[0]);
    });
    enableDrop("creativeUpload", processCreativeFile);

    document.getElementById("addPageBtn").addEventListener("click", addCurrentPage);
    document.getElementById("addBothBtn").addEventListener("click", addBothPages);
    document.getElementById("downloadPngBtn").addEventListener("click", downloadCurrentPng);
    document.getElementById("downloadPdfBtn").addEventListener("click", downloadPdf);

    try {
      // 하우스 프레임 + 기본 샘플 소재 로드. 하나가 실패해도 나머지는 계속 쓸 수 있도록
      // Promise.all이 아니라 개별 safeLoadImage로 로드한다.
      [homepopupBaseImg, splashBaseImg, appexitBaseImg, brandbannerBaseImg, keywordbannerBaseImg, state.bgImg, state.splashCreativeImg, state.homepopupCreativeImg, state.appexitCreativeImg, state.brandbannerCreativeImg, state.keywordbannerCreativeImg, state.logoImg] = await Promise.all([
        safeLoadImage(ASSETS.homepopupBase, "homepopupBase"),
        safeLoadImage(ASSETS.splashBase, "splashBase"),
        safeLoadImage(ASSETS.appexitBase, "appexitBase"),
        safeLoadImage(ASSETS.brandbannerBase, "brandbannerBase"),
        safeLoadImage(ASSETS.keywordbannerBase, "keywordbannerBase"),
        safeLoadImage(ASSETS.sampleBg, "sampleBg"),
        safeLoadImage(ASSETS.sampleCreative, "sampleCreative"),
        safeLoadImage(ASSETS.homepopupCreative, "homepopupCreative"),
        safeLoadImage(ASSETS.appexitCreative, "appexitCreative"),
        safeLoadImage(ASSETS.brandbannerCreative, "brandbannerCreative"),
        safeLoadImage(ASSETS.keywordbannerCreative, "keywordbannerCreative"),
        safeLoadImage(ASSETS.sampleLogo, "sampleLogo"),
      ]);

      creativeUi.splash = { thumbSrc: ASSETS.sampleCreative, name: "샘플 소재 적용됨" };
      creativeUi.homepopup = { thumbSrc: ASSETS.homepopupCreative, name: "샘플 소재 적용됨" };
      creativeUi.appexit = { thumbSrc: ASSETS.appexitCreative, name: "샘플 소재 적용됨" };
      creativeUi.brandbanner = { thumbSrc: ASSETS.brandbannerCreative, name: "샘플 소재 적용됨" };
      creativeUi.keywordbanner = { thumbSrc: ASSETS.keywordbannerCreative, name: "샘플 소재 적용됨" };

      document.getElementById("bgThumb").src = ASSETS.sampleBg;
      document.getElementById("logoThumb").src = ASSETS.sampleLogo;
      document.getElementById("keywordFrameThumb").src = ASSETS.keywordbannerBase;

      try { await document.fonts.load(`700 16px "IBM Plex Sans KR"`); await document.fonts.load(`400 16px "IBM Plex Sans KR"`); } catch(e){}
    } catch (err) {
      // 여기까지 오면 예상 밖의 오류지만, 그래도 화면이 검게 멈춰있지 않도록
      // 로딩 상태는 반드시 풀고 지금 상태 그대로 다시 그린다.
      console.warn("초기 로딩 중 오류:", err);
    } finally {
      const overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.hidden = true;
      setControlsDisabled(false);
      // 로딩 중 눌러뒀을 수 있는 지면 탭을 그대로 유지한 채(강제로 스플래시로
      // 되돌리지 않고) 다시 그린다.
      setPlacement(state.placement);
      refreshQueueUI();
    }
  }

  init();
})();
</script>
